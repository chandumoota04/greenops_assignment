# One public origin: React build at /, Spring Boot (loopback only) at /api/.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /opt/surplus-food/current/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Google Fonts serves Manrope; everything else must come from this origin.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 16k;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API runs on the same host, so a slow connect means it is down.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        expires -1;
    }

    # Vite puts a content hash in asset names, so a long cache is safe.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Deep links such as /batches/4/edit are React routes, so they get index.html.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
