spring:
  application:
    name: surplus-food
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/surplus}
    username: ${DB_USER:surplus}
    password: ${DB_PASSWORD:surplus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  # Nginx in front terminates client connections; the API only listens locally.
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
app:
  release: ${APP_RELEASE:local}
